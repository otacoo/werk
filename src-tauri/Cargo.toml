[package]
name = "werk"
version = "0.5.1"
edition = "2021"
license = "Apache-2.0"
description = "Werk desktop launcher for llama.cpp"
default-run = "werk"

[lib]
name = "werk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "werk"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time", "fs"] }
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
sysinfo = "0.36"
trash = "5"
zip = "2"
tar = "0.4"
flate2 = "1"
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exact: specta v2 is pre-release and the trio must match.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
harness = { path = "../crates/harness" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
